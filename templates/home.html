<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>$title$</title>
    <style>
      :root {
        --bg: #1a1a1a;
        --text-main: #d4c5b0;
      }
      html {
        background-color: var(--bg);
        color: var(--text-main);
        visibility: hidden;
        opacity: 0;
      }
    </style>
    <link rel="preload" href="/style.css" as="style" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>

    $if(banner)$
    <header class="hero" style="--hero-img: url('$banner$')">
    $else$
    <header>
    $endif$
      $if(gol)$
      $if(banner)$$else$
      <canvas id="gol-bg" aria-hidden="true"></canvas>
      $endif$
      $endif$
      <nav>
        <a href="/">root</a>
        <a href="/posts/">posts</a>
        <a href="https://github.com/cxinu">github</a>
      </nav>
      <h1>$title$</h1>
      $if(tagline)$
      <p class="tagline">$tagline$</p>
      $endif$
    </header>

    <main>
      $if(intro)$
      <section class="intro">
        $intro$
      </section>
      $endif$
      $body$ $if(posts_list)$
      <section id="recent-posts">
        <h2>$posts_heading$</h2>
        $posts_list$
      </section>
      $endif$
    </main>

    <footer>
      <hr />
      <nav class="webring-nav">
        <a href="https://ring.seggs.lol/redirect?from=cxinu&dir=prev"><- prev site</a>
        <a href="https://ring.seggs.lol/random" class="webring-label">[WEBRING]</a>
        <a href="https://ring.seggs.lol/redirect?from=cxinu&dir=next">next site -></a>
      </nav>
      <p>Copyright © 2026 | cxinu@github</p>
    </footer>
    <script src="/gol.js"></script>
  </body>
</html>
