<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Archi vs Maitree Fight Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:wght@400;600&display=swap">
<style>
:root{--plum:#2a1033;--dusk:#ff9a3c;--pink:#ff4fa3;--teal:#3fd0c9;--ink:#fff3ea;--box:rgba(30,10,40,.88);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--plum);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif}
#game{position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden;background:linear-gradient(180deg,#5b2a6e 0%,#ff6b6b 55%,var(--dusk) 100%)}
#ground{position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(180deg,#4a3a4f,#2e2233);border-top:4px solid #00000030}
#ground::before{content:"";position:absolute;inset:30% 0 auto 0;height:4px;background:repeating-linear-gradient(90deg,#fff8 0 28px,transparent 28px 56px)}
.title{font-family:'Bungee',Impact,sans-serif}
#hud{position:absolute;top:10px;left:12px;right:12px;display:none;z-index:5}
#hud small{font-weight:600}
#bar{height:14px;border-radius:9px;background:#0007;overflow:hidden;border:2px solid #fff4;margin-top:3px}
#fill{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--pink));transition:width .5s}
#stage{position:absolute;left:0;right:0;top:12%;height:44%}
.char{position:absolute;bottom:0;text-align:center;transition:transform .25s,opacity .25s}
.char .face{font-size:74px;line-height:1;width:112px;height:112px;display:grid;place-items:center;border-radius:50%;border:4px solid #fff;box-shadow:0 6px 0 #0005}
.char .tag{font-weight:600;font-size:13px;margin-top:8px;background:#0008;border-radius:8px;padding:2px 8px;display:inline-block}
#M{left:7%}#M .face{background:var(--teal)}
#A{right:7%}#A .face{background:var(--pink)}
#gang{position:absolute;right:30%;bottom:6px;font-size:34px;letter-spacing:2px}
#scoot{position:absolute;left:3%;bottom:-6px;font-size:64px;transition:transform 1.6s ease-in;z-index:2}
.dim{opacity:.45;transform:scale(.92)}
.talk{transform:translateY(-8px) scale(1.05)}
#box{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));min-height:34%;background:var(--box);border:3px solid #fff;border-radius:16px;padding:14px 16px;z-index:6;cursor:pointer;display:flex;flex-direction:column;gap:8px}
#who{font-family:'Bungee',Impact,sans-serif;font-size:15px;color:var(--dusk)}
#txt{font-size:18px;line-height:1.45;flex:1}
#hint{align-self:flex-end;font-size:12px;opacity:.7}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:16px;color:var(--ink);background:#ffffff14;border:2px solid #fff6;border-radius:12px;padding:10px 12px;margin-top:6px;cursor:pointer}
.opt:hover,.opt:focus-visible{border-color:var(--pink);background:#ff4fa31f;outline:none}
.opt b{color:var(--teal)}
#screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;gap:14px;background:linear-gradient(180deg,#2a1033f2,#5b1f55f2)}
#screen h1{font-size:40px;line-height:1.05;margin:0;color:var(--dusk);text-shadow:3px 3px 0 var(--pink)}
#screen p{margin:0;max-width:34ch;opacity:.9}
.btn{font-family:'Bungee',Impact,sans-serif;font-size:20px;color:var(--plum);background:var(--dusk);border:0;border-radius:14px;padding:14px 28px;box-shadow:0 6px 0 var(--pink);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}#scoot{transition:none}}
#game[data-sc=class]{background:linear-gradient(180deg,#d8efe6,#a9cfc5 62%)}
#game[data-sc=class] #ground{background:linear-gradient(180deg,#b98558,#8f5f3b)}
#game[data-sc=class] #ground::before{inset:0;height:auto;background:repeating-linear-gradient(90deg,#0002 0 3px,transparent 3px 70px)}
#lotdeco,#classdeco{position:absolute;inset:0;pointer-events:none}
#game[data-sc=class] #lotdeco,#game[data-sc=lot] #classdeco,#game[data-sc=class] #scoot,#game[data-sc=class] #gang,#game[data-sc=lot] #npcs,#game[data-sc=lot] #K,#game[data-sc=lot] #desk{display:none}
#sky{position:absolute;left:0;right:0;bottom:38%;height:90px;width:100%}
#trees{position:absolute;left:2%;bottom:36%;font-size:46px}
#parked{position:absolute;left:36%;bottom:33%;font-size:26px;opacity:.5;letter-spacing:8px}
#cctv{position:absolute;right:5%;top:30%;font-size:34px}
#cctv::after{content:"";position:absolute;left:50%;top:100%;width:6px;height:90px;background:#2a1033}
#board{position:absolute;left:12%;right:12%;top:3%;height:17%;background:#244a3c;border:6px solid #8a5a34;border-radius:6px;display:grid;place-items:center;font-family:'Bungee',Impact,sans-serif;font-size:16px;color:#e8f5ee}
#game .char .face{font-size:52px;width:88px;height:88px;background:#e8b98a;position:relative;z-index:0;margin:0 auto}
#game .char .face::before{content:"";position:absolute;z-index:-1;left:-7px;right:-7px;top:-9px;height:62%;border-radius:50% 50% 8px 8px;background:var(--hair)}
.body{width:86px;height:54px;margin:-6px auto 0;border-radius:34px 34px 6px 6px;background:var(--top);border:3px solid #fff;border-bottom:0}
#M{--hair:#1b1020;--top:#3fd0c9}#A{--hair:#2a0f2e;--top:#ff4fa3}#K{--hair:#6b3d1c;--top:#ffd34d}
#K{left:2%}
#game[data-sc=class] #M{left:33%}
#game[data-sc=class] #A{right:3%}
#desk{position:absolute;right:1%;bottom:0;width:150px;height:46px;background:#c89463;border:3px solid #6b4423;border-radius:6px 6px 0 0;z-index:3}
#game #gang{display:flex;gap:4px;right:36%;bottom:0;font-size:22px;letter-spacing:0}
.g{width:44px;height:44px;border-radius:50%;background:#e8b98a;border:3px solid #fff;display:grid;place-items:center;position:relative;margin-bottom:44px}
.g::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);width:40px;height:44px;border-radius:20px 20px 0 0;background:#222}
#npcs{position:absolute;left:6%;right:6%;top:14px;display:flex;justify-content:space-around}
#npcs i{font-style:normal;font-size:26px;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:3px solid #fff;background:#e8b98a;box-shadow:0 22px 0 -6px var(--c,#7a8cff)}
#npcs i:nth-child(2){--c:#ff8a5c}#npcs i:nth-child(3){--c:#6bd68a}#npcs i:nth-child(4){--c:#c77dff}#npcs i:nth-child(5){--c:#ffb3c7}
@media (prefers-reduced-motion:no-preference){.laugh i{animation:bob .35s infinite alternate}.laugh i:nth-child(even){animation-delay:.17s}@keyframes bob{to{transform:translateY(-8px)}}}
#panel{position:absolute;left:10px;right:10px;top:12%;aspect-ratio:520/300;z-index:4;display:none;border:5px solid #111;background:#fff;box-shadow:0 8px 0 #0006;transform:rotate(-1deg)}
#panel svg{width:100%;height:100%;display:block}
#panel.show{display:block}
#game.pn #stage,#game.pn #scoot{visibility:hidden}
@media (prefers-reduced-motion:no-preference){#panel.show{animation:slam .25s}@keyframes slam{from{transform:scale(1.25) rotate(2deg);opacity:0}}}
#trees{display:none}
#game #sky{height:62%}
#csky{position:absolute;left:0;top:0;width:100%;height:62%}
#game #board{left:32%;right:5%;top:5%;height:20%}
#game[data-sc=lot] #ground{border-top:6px solid #e9c46a}
#game[data-sc=lot] #ground::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 80px,#fff5 80px 84px)}
@media (prefers-reduced-motion:no-preference){#panel.go .ride{animation:ride 1.4s ease-in forwards}@keyframes ride{to{transform:translateX(440px)}}}
</style>
</head>
<body>

<script>
const $=id=>document.getElementById(id);
let sass=0, i=0, busy=false, onNext=null, typer=null;

const duel=[

     {t:"“Seat tune chheeni thi, sharam tujhe aani chahiye. Hum toh bas peeche baith gaye.”",p:24,r:"“Ooooh,” from nobody, but you felt it."},

 {a:"B-section wali sab yahin hain, samajh le!",af:"😠",
  o:[{t:"“Ek seat ke liye gang? Next time padh le, copy ki zaroorat nahi padegi.”",p:34,risk:.3,r:"Archi’s face goes red. The gang stays quiet. No backup."},

     {t:"“Main aaj nahi ladne wali. Bye.”",p:10,r:"Archi smirks. Wrong move."}]}

const intro=[
 {pn:"seat",sc:"class",n:"Earlier, A section, 3rd back row. Archi, alone in A while her friends are in B, wants a seat where cheating is easy. She sits right on Akshita’s spot.",mf:"🙂",af:"😒"},
 {pn:"seat",kd:1,n:"Akshita asks her to move. Archi doesn’t. Maitree stands up for Akshita. Archi still doesn’t move, so everyone just sits behind her.",mf:"😤"},
 {laugh:1,n:"Maitree and Akshita joke about it with the group. Half the class laughs. Archi stays silent: no gang, no guts.",mf:"😏",af:"😶"},
 {sc:"lot",n:"Tests are over. Maitree walks to the parking lot alone. Archi’s B-section gang is already there, watching quietly. Female vs female, no intervention needed.",mf:"🙂",af:"😏"},
 {w:"M",t:"Bas ghar jaana hai… *rolls scooty out of the stand*",mf:"😮‍💨"},
 {pn:"stomp",n:"STOMP. Archi’s foot lands on the front tyre and stays there.",mf:"😳",af:"😏",fx:1},
 {pn:"leg",w:"M",t:"Archi, let me go.",mf:"😐"},
 {pn:"rev",n:"Maitree revs the scooty. Archi stumbles.",mf:"😈",af:"😳",fx:1}
];

function say(who,text,face,next){
  const w=$("who"),t=$("txt"),h=$("hint");
  w.textContent=who==="A"?"Archi":who==="M"?"Maitree":"";
  ["M","A"].forEach(c=>$(c).className="char"+(who&&who!==c?" dim":who===c?" talk":""));
  t.textContent="";h.textContent="";clearInterval(typer);
  let k=0;busy=true;
  typer=setInterval(()=>{t.textContent=text.slice(0,++k);if(k>=text.length){clearInterval(typer);busy=false;h.textContent="tap ▸";}},16);
  onNext=next;
}
$("box").onclick=()=>{
  if(busy){clearInterval(typer);$("txt").textContent=cur;busy=false;$("hint").textContent="tap ▸";return;}
  if(onNext){const f=onNext;onNext=null;f();}
};
let cur="";
const _say=say;
say=function(w,t,f,n){cur=t;_say(w,t,f,n)};

function setScene(n){$("game").dataset.sc=n}
const rays=(x,y,n,a,b)=>{let d="";for(let k=0;k<n;k++){const t=k/n*6.283+Math.sin(k*7)*.08,c=Math.cos(t),s=Math.sin(t);d+=`M${x+c*a} ${y+s*a}L${x+c*b} ${y+s*b}`}return d};
const S='stroke="#111" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"';

const P=b=>`<svg viewBox="0 0 520 300"><defs><pattern id="ht" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.8" fill="#111"/></pattern></defs><rect width="520" height="300" fill="#fff"/><rect width="520" height="300" fill="url(#ht)" opacity=".16"/>${b}</svg>`;
const PANELS={
 seat:()=>P(`<path d="${rays(270,140,36,60,420)}" stroke="#bbb" stroke-width="2"/><g ${S}>
<rect x="95" y="175" width="330" height="22" fill="#e8d2b0"/><path d="M120 197v80M400 197v80"/><rect x="225" y="205" width="96" height="14" fill="#a9743f"/>
<path d="M238 138Q205 120 245 85M302 138Q335 120 295 85" fill="none" stroke-width="10"/>

<circle cx="270" cy="95" r="30" fill="#ffe3cc"/><path d="M238 90Q240 55 270 58Q302 55 304 90Q290 72 270 74Q250 72 238 90zM244 66l-8-16 16 8M262 58v-18l12 16M284 60l12-14-2 18" fill="#111"/>
<path d="M254 98h12M276 98h12M252 88l16 4M288 88l-16 4M258 114q14 8 26-2" fill="none"/>
<circle cx="80" cy="150" r="24" fill="#ffe3cc"/><path d="M56 146Q58 118 80 120Q104 118 104 146Q92 134 80 134Q66 134 56 146z" fill="#6b3d1c"/><path d="M68 150l10 4M92 150l-10 4M72 166h16" fill="none"/><path d="M58 178h44l8 60h-60z" fill="#ffd34d"/><path d="M112 120q9 12 0 20q-9-8 0-20z" fill="#bfe9ff" stroke-width="3"/></g>
<text x="20" y="95" font-size="34" fill="#fff" ${F}>!?</text><text x="250" y="52" font-size="46" fill="#ff4fa3" ${F} transform="rotate(-8 250 52)">PLOP!</text>`),

<path d="M60 -10H140L230 100L170 138z" fill="#2b2b3a"/><path d="M168 94L250 112Q282 126 266 152L168 152Q144 130 168 94z" fill="#fff"/><path d="M164 150h108" stroke-width="8"/></g>
<text x="14" y="284" font-size="58" fill="#ff4fa3" ${F} transform="rotate(-6 14 284)">STOMP!</text>`),
 leg:()=>P(`<path d="${rays(340,170,40,80,440)}" stroke="#bbb" stroke-width="2"/><g ${S}>
<circle cx="370" cy="262" r="100" fill="#222"/><circle cx="370" cy="262" r="48" fill="#ddd"/>
<path d="M265 180Q370 140 475 180" fill="none" stroke-width="26"/><path d="M265 180Q370 140 475 180" fill="none" stroke="#3fd0c9" stroke-width="18"/>
<path d="M84 100Q80 48 120 50Q160 48 156 100L162 190H78z" fill="#111"/><path d="M62 300Q70 190 120 175Q170 190 178 300z" fill="#3fd0c9"/><circle cx="120" cy="100" r="34" fill="#ffe3cc"/><path d="M84 92Q90 62 120 64Q150 62 156 92Q140 76 120 78Q100 76 84 92z" fill="#111"/>
<path d="M100 100h14M128 100h14M98 88l18 8M144 88l-18 8M110 120h20" fill="none"/><path d="M165 210L255 190" stroke-width="16"/><path d="M165 210L255 190" stroke="#3fd0c9" stroke-width="8"/>
<path d="M510 0L450 112L385 152" fill="none" stroke-width="34"/><path d="M510 0L450 112L385 152" fill="none" stroke="#2b2b3a" stroke-width="26"/><path d="M345 146l50-6 24 14v16h-74z" fill="#fff"/></g>
<text x="170" y="60" font-size="30" fill="#fff" ${F}>GRRR...</text>`),
 rev:()=>P(`<path d="${rays(260,210,50,60,500)}" stroke="#aaa" stroke-width="2"/><g ${S}>
<rect x="0" y="-4" width="520" height="92" fill="#fff"/><path d="M70 56Q130 20 190 56Q130 78 70 56zM330 56Q390 20 450 56Q390 78 330 56z" fill="#fff"/><circle cx="132" cy="52" r="13" fill="#3fd0c9"/><circle cx="388" cy="52" r="13" fill="#3fd0c9"/><path d="M66 30L196 50M324 50L454 30" stroke-width="9"/>
<rect x="40" y="170" width="420" height="28" rx="14" fill="#888"/><path d="M300 240L420 180L474 225L350 290z" fill="#3fd0c9"/><path d="M392 150Q444 140 454 178Q444 214 396 204z" fill="#ffe3cc"/><path d="M404 162l32 4M402 177l36 4M402 192l32 4" fill="none" stroke-width="3"/>
<path d="M476 150Q506 190 476 236M462 232l14 8 8-16" fill="none"/><path d="M24 250q-20-20 10-30q10-25 40-10q30-5 30 25q-10 25-45 20q-20 8-35-5z" fill="#ddd"/></g>
<text x="20" y="140" font-size="50" fill="#3fd0c9" ${F} transform="rotate(-4 20 140)">VROOOM!</text>`)
};

PANELS.exitR=()=>P(`<rect width="520" height="300" fill="#ff6b6b"/><rect width="520" height="110" fill="#5b2a6e"/><circle cx="260" cy="190" r="84" fill="#ffd34d"/><path d="${rays(260,190,40,90,500)}" stroke="#fff" stroke-width="2" opacity=".6"/><rect y="232" width="520" height="68" fill="#2e2233"/><path d="M0 262h520" stroke="#fff6" stroke-width="4" stroke-dasharray="30 24"/>

const ART=t=>t[0]=="I"?`<svg viewBox="0 0 360 300" style="width:100%;max-width:360px;max-height:40vh;border:4px solid #111;border-radius:6px"><rect width="360" height="300" fill="#ff6b6b"/><rect width="360" height="100" fill="#5b2a6e"/><path d="${rays(180,170,32,80,320)}" stroke="#ffe27a" stroke-width="3" opacity=".6"/><circle cx="180" cy="170" r="64" fill="#ffd34d"/><rect y="222" width="360" height="78" fill="#2e2233"/><g stroke="#111" stroke-width="3" stroke-linejoin="round"><circle cx="150" cy="226" r="15" fill="#222"/><circle cx="222" cy="226" r="15" fill="#222"/><path d="M135 226Q140 200 165 196H205L228 208L238 226z" fill="#3fd0c9"/><path d="M168 196L180 160H202L200 196z" fill="#ff4fa3"/><path d="M180 144Q158 138 144 160Q166 156 182 156z" fill="#111"/><circle cx="190" cy="148" r="11" fill="#ffe3cc"/><path d="M186 148h14" stroke-width="4"/></g><path d="M10 190h100M20 205h80M0 175h70" stroke="#fff" stroke-width="3" opacity=".8"/><g fill="#111"><circle cx="40" cy="236" r="7"/><rect x="34" y="243" width="12" height="22"/><circle cx="62" cy="238" r="6"/><rect x="57" y="244" width="10" height="20"/><circle cx="80" cy="238" r="6"/><rect x="75" y="244" width="10" height="20"/></g><text x="150" y="122" font-size="22">✨</text><text x="262" y="168" font-size="22">✨</text><text x="300" y="130" font-size="18">💅</text><text x="180" y="54" text-anchor="middle" font-size="38" fill="#ffd34d" ${F}>AURA +9999</text><text x="180" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" style="paint-order:stroke;stroke:#2a1033;stroke-width:5px">bhen ki lodi ❌  aura farmed ✅</text></svg>`:`<div style="font-size:80px">${t[0]=="D"?"😐":"💀"}</div>`;
function showPanel(n){const p=$("panel");$("game").classList.toggle("pn",!!n);if(!n){p.className="";return}p.innerHTML=PANELS[n]();p.className="show"}
function runIntro(){
  if(i>=intro.length){i=0;showPanel();$("hud").style.display="block";runDuel(0);return}
  const s=intro[i++];
  if(s.sc)setScene(s.sc);
  showPanel(s.pn);
  $("npcs").classList.toggle("laugh",!!s.laugh);
  $("npcs").querySelectorAll("i").forEach((e,k)=>e.textContent=s.laugh?"😂🤣😆😂🤭".match(/./gu)[k]:"🙂");
  $("kf").textContent=s.laugh?"😂":s.kd?"😠":"🙂";
  if(s.mf)$("mf").textContent=s.mf; if(s.af)$("af").textContent=s.af;
  if(s.fx){$("scoot").classList.add("shake");setTimeout(()=>$("scoot").classList.remove("shake"),400)}
  say(s.w||"",s.n||s.t,"",runIntro);
}

function runDuel(r){
  if(r>=duel.length)return finale();
  const d=duel[r];
  $("af").textContent=d.af;
  say("A",d.a,"",()=>{
    $("who").textContent="Maitree — pick your reply";
    $("txt").innerHTML="";$("hint").textContent="";
    d.o.forEach(o=>{
      const b=document.createElement("button");b.className="opt";b.textContent=o.t;
      b.onclick=e=>{e.stopPropagation();pick(r,o)};
      $("txt").appendChild(b);
    });
    ["M","A"].forEach(c=>$(c).className="char");
    onNext=null;busy=false;
  });
}

function pick(r,o){
  let p=o.p,line=o.r,face="😎";
  if(o.risk&&Math.random()<o.risk){p=3;line="That came out wrong. Maitree’s voice cracked. Archi smirks.";face="😅"}
  sass=Math.min(100,sass+p);
  $("fill").style.width=sass+"%";
  $("mf").textContent=face;
  $("txt").innerHTML="";
  say("",line,"",()=>runDuel(r+1));
}

function finale(){
  $("hud").style.display="none";
  if(sass>=60){
    $("af").textContent="😡";$("mf").textContent="💅";
    showPanel("exitA");say("A","Nikal, bhen ki lodi.","",()=>{showPanel("exitM");
      $("af").textContent="🤬";
      say("M","This shows your standards BTW! 💅✨","",()=>{showPanel("exitR");
        say("","Maitree kicks the stand up, revs the scooty, and rides out. Gang: speechless.","",()=>{
          $("panel").classList.add("go");$("scoot").style.transform="translateX(110vw)";$("mf").textContent="😌";
          setTimeout(()=>end("ICONIC EXIT 💅✨","Sass Meter: "+sass+"/100. Maitree left. Archi is still processing."),1500);
        });
      });
    });
  }else if(sass>=35){
    say("","Neither of you wins. Archi lifts her foot, mutters something, and walks off. Maitree rides out quietly, heart pounding.","",()=>
      end("DRAW 😐","Sass Meter: "+sass+"/100. You survived, but no iconic exit. Try bolder replies."));
  }else{
    $("mf").textContent="😳";$("af").textContent="😈";
    say("A","Dekha? Camera, camera. Ab chup reh.","",()=>
      say("","Maitree pushes her scooty out. The gang is laughing. Aura: zero.","",()=>
        end("OWNED 💀","Sass Meter: "+sass+"/100. Yikes. Be bolder next time.")));
  }
}

function end(title,sub){
  const s=$("screen");s.style.display="flex";
  showPanel();s.innerHTML=ART(title)+'<h1 class="title" style="font-size:34px">'+title+'</h1><p>'+sub+'</p><button class="btn" id="again">Play again</button>';
  $("again").onclick=reset;
}
function reset(){
  sass=0;i=0;$("fill").style.width="0";$("scoot").style.transform="";
  $("mf").textContent="🙂";$("af").textContent="😏";
  $("screen").style.display="none";runIntro();
}
$("start").onclick=()=>{$("screen").style.display="none";runIntro()};
</script>
